<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebRTC P2P Lobby</title>

    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="lobby-container">

        <div id="first-lobby">
            <div class="section">
                <div>My ID: <span id="my-id" class="id">loading...</span></div>
            </div>

            <hr>

            <div class="section">
                <button id="create-room" class="btn" onclick="createRoom()">Create Room</button>
            </div>

            <hr>

            <div class="section">
                <h3 id="available-rooms">Available Rooms (0)</h3>
            </div>

            <div class="section">
                <ul id="rooms-list"></ul>
            </div>
        </div>

        <div id="second-lobby">
            <div class="section">
                <div>My ID: <span id="my-id-second" class="id">loading...</span></div>
                <div>Host ID: <span id="host-id" class="id">loading...</span></div>
            </div>

            <hr>

            <div class="section">
                <div>Room ID: <span id="room-id" class="id">loading...</span></div>
            </div>

            <hr>

            <div class="section">
                <button id="leave-room" class="btn" onclick="leaveRoom()">Leave Room</button>
                <button id="start-room" class="btn" onclick="start()">Start Room</button>
            </div>

            <hr>

            <div class="section">
                <h3 id="players-joined">Players Joined (1)</h3>
            </div>

            <div class="section">
                <ul id="players-list"></ul>
            </div>
        </div>


        <!--

        <hr class="info-divider">

        <div class="state-lobby">
            <div class="section">
                <button class="btn btn-primary" onclick="createRoom()">Create Room</button>
            </div>

            <hr>

            <div class="section">
                <h3>Rooms</h3>
                <ul id="roomsList"></ul>
            </div>
        </div>

        <div class="state-room">
            <div class="section row-align">
                <h3 id="joinedRoom"><span class="null-text">null</span></h3>
                <button class="btn btn-danger" onclick="leaveRoom()">Leave Room</button>
            </div>

            <hr>
            <div class="section row-align">
                <button class="btn btn-success" onclick="start()">Start</button>
            </div>
            <hr>
        </div>-->

    </div>

    <div id="game-area">
        <canvas id="main-canvas"></canvas>
        <div id="player-bar"></div>
    </div>

    <script>
        const scripts = ["./network/connector.js", "./network/p2p.js", "card.js", "hand.js", "tableHand.js", "./network/networkUi.js", "main.js"];

        scripts.forEach(file => {
            const script = document.createElement("script");
            script.src = `${file}?t=${Date.now()}`;
            script.async = false;
            document.body.appendChild(script);
        });


        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js');
            });
        }
    </script>
</body>

</html>
