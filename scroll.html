<!DOCTYPE html>
<html>
<head>
  <style>
    canvas { border: 1px solid #ccc; touch-action: none; cursor: grab; }
  </style>
</head>
<body>

<canvas id="c" width="500" height="150"></canvas>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

const w = 100, total = 30;
const maxX = total * w - canvas.width;
let x = 0, targetX = 0, vel = 0;
let isDrag = false, lastX = 0, lastT = 0;

canvas.addEventListener('pointerdown', e => {
  isDrag = true;
  lastX = e.clientX;
  lastT = performance.now();
  vel = 0;
});

window.addEventListener('pointermove', e => {
  if (!isDrag) return;
  const now = performance.now();
  const dt = now - lastT;
  const dx = lastX - e.clientX;
  targetX = Math.max(0, Math.min(maxX, targetX + dx));
  if (dt > 0) vel = (dx / dt) * 16;
  lastX = e.clientX;
  lastT = now;
});

window.addEventListener('pointerup', () => isDrag = false);

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const delta = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
  targetX = Math.max(0, Math.min(maxX, targetX + delta));
}, { passive: false });

function loop() {
  if (isDrag) {
    x += (targetX - x) * 0.4;
  } else {
    if (Math.abs(vel) > 0.1) {
      targetX = Math.max(0, Math.min(maxX, targetX + vel));
      vel *= 0.92;
    }
    x += (targetX - x) * 0.15;
  }

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  for (let i = 0; i < total; i++) {
    const itemX = i * w - x;
    if (itemX + w < 0 || itemX > canvas.width) continue;
    ctx.strokeRect(itemX + 5, 20, w - 10, 80);
    ctx.fillText(`Item ${i + 1}`, itemX + 20, 65);
  }

  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
